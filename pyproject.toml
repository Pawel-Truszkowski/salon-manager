[project]
name = "salon-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asgiref==3.11.1",
    "django==6.0.6",
    "django-anymail>=15.0",
    "django-environ>=0.14.0",
    "djangorestframework==3.17.1",
    "gunicorn==26.0.0",
    "packaging==26.2",
    "psycopg2-binary>=2.9.12",
    "sqlparse==0.5.5",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=7.0.0",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "DJ",   # flake8-django
    "SIM",  # flake8-simplify
]
ignore = ["E501"]  # line length is handled by `ruff format`

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]  # `from .base import *`

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.format]
quote-style = "preserve"
