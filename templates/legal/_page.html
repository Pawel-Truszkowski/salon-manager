{% extends "base.html" %}
{# Privacy policy and booking terms: one plain reading column, sections linkable by id #}
{% block content %}
<section class="rb-section rb-legal">
  <div class="container-xl px-4 px-lg-5">
    <article class="rb-legal-body">
      <h1>{% block legal_title %}{% endblock %}</h1>
      <p class="rb-legal-date">Obowiązuje od 19 października 2026 r.</p>
      {% block legal_body %}{% endblock %}
    </article>
  </div>
</section>
{% endblock %}
