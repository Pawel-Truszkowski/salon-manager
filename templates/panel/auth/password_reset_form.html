{% extends 'panel/auth/base_auth.html' %}

{% block title %}Reset hasła{% endblock %}

{% block auth_content %}
<p class="small text-muted">Podaj adres e-mail przypisany do konta — wyślemy link do ustawienia nowego hasła.</p>
<form method="post">
  {% csrf_token %}
  {% include 'panel/auth/_form_fields.html' %}
  <button type="submit" class="btn panel-btn-primary w-100">Wyślij link</button>
</form>
<p class="text-center mt-3 mb-0 small"><a href="{% url 'panel:login' %}">Wróć do logowania</a></p>
{% endblock %}
