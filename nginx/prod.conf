server {
    listen 80;
    server_name royalbeauty-studiourody.pl www.royalbeauty-studiourody.pl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name royalbeauty-studiourody.pl www.royalbeauty-studiourody.pl;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    
    # Pliki statyczne serwowane bezpośrednio przez nginx
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
 
    location /media/ {
        alias /app/media/;
        expires 7d;
    }
 
    # Cały pozostały ruch → Gunicorn
    location / {
        proxy_pass          http://web:8000;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
 
        # Mówimy Django że połączenie przyszło przez HTTPS
        # (Cloudflare zdejmuje SSL przed wysłaniem do nas)
        proxy_set_header    X-Forwarded-Proto $scheme;
 
        proxy_read_timeout  120s;
    }
}
 